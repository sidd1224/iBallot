version: "3.9"

services:

  db:
    container_name: iballot-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=appdbuser
      - POSTGRES_PASSWORD=appdbpassword
      - POSTGRES_DB=appdbtest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Load your dump.sql automatically on first startup
      - ./backend/dump.sql:/docker-entrypoint-initdb.d/init.sql
  
  backend-test:
    container_name: iballot-backend-test
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules # Prevent host node_modules from overwriting container's
    environment:
      - PORT=8080
      - JWT_SECRET=test_secret_key
      # Add database variables if your tests require a real DB connection:
      - POSTGRES_USER=appdbuser
      - POSTGRES_PASSWORD=appdbpassword
      - POSTGRES_DB=appdbtest
      - DB_URL=postgresql://appdbuser:appdbpassword@db:5432/appdbtest
    command: npm run test 
    # If you have a database service, uncomment the depends_on section:
    depends_on:
      - db
  backend:
    container_name: iballot-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    restart: always
    ports:
      - "5000:8080"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/public/symbols:/app/public/symbols   # ✅ FIXED: bind mount instead of volume
    command: npm run server
    environment:
      - PORT=8080
      - CONTRACT_ADDRESS
      - PRIVATE_KEY
      - RELAYER_PRIVATE_KEY
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - DB_URL
      - SECRET_SALT
      - RPC_URL
      - ADMIN_TOKEN
      - JWT_SECRET
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://frontend-admin:8080,http://frontend-voter:8080

  frontend-admin:
    container_name: iballot-frontend-admin
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    working_dir: /app
    restart: always
    ports:
      - "3000:8080"   # maps host 3000 -> nginx 8080 in container
    volumes:
      - ./frontend-admin:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - PORT=8080
      - VITE_API_URL=http://backend:8080
      - VITE_API_KEY=${VITE_API_KEY}
      - VITE_AUTH_DOMAIN=${VITE_AUTH_DOMAIN}
      - VITE_PROJECT_ID=${VITE_PROJECT_ID}
      - VITE_STORAGE_BUCKET=${VITE_STORAGE_BUCKET}
      - VITE_MESSAGING_SENDER_ID=${VITE_MESSAGING_SENDER_ID}
      - VITE_APP_ID=${VITE_APP_ID}
    depends_on:
      - backend

  frontend-voter:
    container_name: iballot-frontend-voter
    build:
      context: ./frontend-voter
      dockerfile: Dockerfile
    working_dir: /app
    restart: always
    ports:
      - "3001:8080"   # maps host 3001 -> nginx 8080 in container
    volumes:
      - ./frontend-voter:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - PORT=8080
      - VITE_API_URL=http://backend:8080
      - VITE_API_KEY=${VITE_API_KEY}
      - VITE_AUTH_DOMAIN=${VITE_AUTH_DOMAIN}
      - VITE_PROJECT_ID=${VITE_PROJECT_ID}
      - VITE_STORAGE_BUCKET=${VITE_STORAGE_BUCKET}
      - VITE_MESSAGING_SENDER_ID=${VITE_MESSAGING_SENDER_ID}
      - VITE_APP_ID=${VITE_APP_ID}
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
  postgres_data:
  
