services:
  backend:
    container_name: iballot-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    restart: always
    ports:
      - "${PORT}:5000"
    # depends_on for db and firebase removed
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: npm run server
    environment:
      - CONTRACT_ADDRESS
      - PRIVATE_KEY
      - RELAYER_PRIVATE_KEY
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - PORT
      - DB_URL
      - SECRET_SALT
      - RPC_URL
      - ADMIN_TOKEN
      - JWT_SECRET

  frontend:
    container_name: iballot-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - VITE_API_KEY=${VITE_API_KEY}
      - VITE_AUTH_DOMAIN=${VITE_AUTH_DOMAIN}
      - VITE_PROJECT_ID=${VITE_PROJECT_ID}
      - VITE_STORAGE_BUCKET=${VITE_STORAGE_BUCKET}
      - VITE_MESSAGING_SENDER_ID=${VITE_MESSAGING_SENDER_ID}
      - VITE_APP_ID=${VITE_APP_ID}
      - VITE_API_URL=http://localhost:5000

  
volumes:
  # db_data volume removed
  backend_node_modules:
  frontend_node_modules: