name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main # This workflow runs every time you push to the 'main' branch
    paths:
      - 'backend/**' # Only run if changes are detected in the backend folder

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v1'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iballot-repo/iballot-backend:latest -f backend/Dockerfile ./backend
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iballot-repo/iballot-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy iballot-backend \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iballot-repo/iballot-backend:latest \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated