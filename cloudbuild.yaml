# ===============================
# Cloud Build config for iBallot frontend-voter
# ===============================

steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    # Step: Build the Docker image
    - 'build'
    - '-t'
    - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'   # ✅ use _SERVICE_NAME, not SERVICE_NAME
    - '--build-arg'
    - 'VITE_API_URL=${_VITE_API_URL}'                     # ✅ use ${_VITE_API_URL} format
    - './frontend-voter'                                  # build context
    - '-f'
    - './frontend-voter/Dockerfile'                       # path to Dockerfile

# Push the newly built image to Google Container Registry
images:
- 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'        # ✅ updated variable reference

# Custom build-time substitutions
substitutions:
  _VITE_API_URL: 'https://iballot-backend-715732606815.asia-south1.run.app'
  _SERVICE_NAME: 'iballot-frontend-voter'
